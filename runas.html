<div class="rune"><label>El</label><input type="number" min="0" inputmode="numeric" value="5"></div><div class="rune"><label>Eld</label><input type="number" min="0" inputmode="numeric" value="3"></div><div class="rune"><label>Tir</label><input type="number" min="0" inputmode="numeric" value="5"></div><div class="rune"><label>Nef</label><input type="number" min="0" inputmode="numeric" value="2"></div><div class="rune"><label>Eth</label><input type="number" min="0" inputmode="numeric" value="4"></div><div class="rune"><label>Ith</label><input type="number" min="0" inputmode="numeric" value="4"></div><div class="rune"><label>Tal</label><input type="number" min="0" inputmode="numeric" value="2"></div><div class="rune"><label>Ral</label><input type="number" min="0" inputmode="numeric" value="2"></div><div class="rune"><label>Ort</label><input type="number" min="0" inputmode="numeric" value="1"></div><div class="rune"><label>Thul</label><input type="number" min="0" inputmode="numeric" value="0"></div><div class="rune"><label>Amn</label><input type="number" min="0" inputmode="numeric" value="0"></div><div class="rune"><label>Sol</label><input type="number" min="0" inputmode="numeric" value="0"></div><div class="rune"><label>Shael</label><input type="number" min="0" inputmode="numeric" value="0"></div><div class="rune"><label>Dol</label><input type="number" min="0" inputmode="numeric" value="0"></div><div class="rune"><label>Hel</label><input type="number" min="0" inputmode="numeric" value="0"></div><div class="rune"><label>Io</label><input type="number" min="0" inputmode="numeric" value="0"></div><div class="rune"><label>Lum</label><input type="number" min="0" inputmode="numeric" value="0"></div><div class="rune"><label>Ko</label><input type="number" min="0" inputmode="numeric" value="0"></div><div class="rune"><label>Fal</label><input type="number" min="0" inputmode="numeric" value="0"></div><div class="rune"><label>Lem</label><input type="number" min="0" inputmode="numeric" value="0"></div><div class="rune"><label>Pul</label><input type="number" min="0" inputmode="numeric" value="0"></div><div class="rune"><label>Um</label><input type="number" min="0" inputmode="numeric" value="0"></div><div class="rune"><label>Mal</label><input type="number" min="0" inputmode="numeric" value="0"></div><div class="rune"><label>Ist</label><input type="number" min="0" inputmode="numeric" value="0"></div><div class="rune"><label>Gul</label><input type="number" min="0" inputmode="numeric" value="0"></div><div class="rune"><label>Vex</label><input type="number" min="0" inputmode="numeric" value="0"></div><div class="rune"><label>Ohm</label><input type="number" min="0" inputmode="numeric" value="0"></div><div class="rune"><label>Lo</label><input type="number" min="0" inputmode="numeric" value="0"></div><div class="rune"><label>Sur</label><input type="number" min="0" inputmode="numeric" value="0"></div><div class="rune"><label>Ber</label><input type="number" min="0" inputmode="numeric" value="0"></div><div class="rune"><label>Jah</label><input type="number" min="0" inputmode="numeric" value="0"></div><div class="rune"><label>Cham</label><input type="number" min="0" inputmode="numeric" value="0"></div><div class="rune"><label>Zod</label><input type="number" min="0" inputmode="numeric" value="0"></div>
</div><div class="toolbar"><button class="action" id="saveRunes">Guardar cambios</button></div></div></main>
<script>
(function(){
const KEY="cudrox-runes-v11";
const names=["El","Eld","Tir","Nef","Eth","Ith","Tal","Ral","Ort","Thul","Amn","Sol","Shael","Dol","Hel","Io","Lum","Ko","Fal","Lem","Pul","Um","Mal","Ist","Gul","Vex","Ohm","Lo","Sur","Ber","Jah","Cham","Zod"];
const inputs=[...document.querySelectorAll(".rune input")];
const priority=new Set(["Sol","Io","Lum","Lem"]);
document.querySelectorAll(".rune").forEach((el,i)=>{if(priority.has(names[i])){el.classList.add("priority");el.title="Prioridad CUDROX"}});
try{const inv=JSON.parse(localStorage.getItem("cudrox-inventory-v9"));if(inv&&inv.level)document.getElementById("sharedLevel").textContent=inv.level}catch(e){}
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.length===inputs.length)inputs.forEach((el,i)=>el.value=saved[i])}catch(e){}
document.getElementById("saveRunes").onclick=function(){
 const values=inputs.map(el=>Math.max(0,parseInt(el.value)||0));
 localStorage.setItem(KEY,JSON.stringify(values));
 this.textContent="Guardado ✓";this.classList.add("saved");
 setTimeout(()=>{this.textContent="Guardar cambios";this.classList.remove("saved")},1400);
};
})();
</script></body></html>
